<body>
  <div class="wrap">
    <header class="top">
      <div class="brand"><div class="logo" aria-hidden="true">↗</div><div><strong>MEU TREINO<span style="display:inline;color:var(--accent)">.</span></strong><span>Seu diário de evolução</span></div></div>
      <nav class="desktop-nav" id="desktopNav" aria-label="Navegação principal"></nav>
      <div class="top-right"><span class="save-label"><span class="dot"></span> Salvo neste aparelho</span></div>
    </header>
    <main id="app"></main>
    <div class="footer">Consistência acima da perfeição. Um treino de cada vez. 💪</div>
  </div>
  <nav class="mobile-nav" id="mobileNav" aria-label="Navegação principal"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script>
  (() => {
    'use strict';
    const KEY='meu_treino_diario_v1';
    const PLANS={
      1:{title:'Peito, costas e ombros',subtitle:'Superiores • Treino A',cardio:true,ex:[['supino-reto','Supino reto',3,'8–12'],['puxada-alta','Puxada alta',3,'10–12'],['remada-baixa','Remada baixa',3,'10–12'],['desenvolvimento','Desenvolvimento de ombros',3,'10–12'],['triceps-polia','Tríceps na polia',2,'12']]},
      2:{title:'Pernas A',subtitle:'Foco em quadríceps',cardio:false,ex:[['agachamento','Agachamento',3,'10'],['leg-press','Leg press',3,'12'],['extensora','Cadeira extensora',3,'12'],['mesa-flexora','Mesa flexora',3,'12'],['panturrilha-a','Panturrilha',3,'15']]},
      3:{title:'Peito, costas e braços',subtitle:'Superiores • Treino B',cardio:true,ex:[['supino-inclinado','Supino inclinado',3,'10'],['remada-articulada','Remada articulada',3,'10'],['puxada-neutra','Puxada alta pegada neutra',3,'10'],['rosca-direta','Rosca direta',3,'12'],['triceps-corda','Tríceps corda',3,'12']]},
      4:{title:'Pernas B',subtitle:'Foco em posterior e glúteos',cardio:false,ex:[['stiff','Terra romeno (stiff)',3,'10'],['afundo','Afundo',3,'10 por perna'],['extensora-b','Cadeira extensora',3,'12'],['cadeira-flexora','Cadeira flexora',3,'12'],['panturrilha-b','Panturrilha',3,'15']]},
      5:{title:'Superiores e abdômen',subtitle:'Superiores • Treino C',cardio:true,ex:[['supino-maquina','Supino máquina',3,'10'],['remada-sexta','Remada baixa',3,'10'],['elevacao-lateral','Elevação lateral',3,'12'],['rosca-martelo','Rosca martelo',3,'12'],['prancha','Prancha abdominal',3,'30–45 s','seconds']]}
    };
    const SHORT_DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
    const LONG_DAYS=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    const TABS=[['treino','⌂','Treino'],['historico','▤','Histórico'],['progresso','▥','Progresso'],['ajustes','⚙','Ajustes']];
    let data=loadData();
    let date=toISO(new Date());
    let tab='treino';
    let chartEx='supino-reto';
    let timerRemaining=0,timerTick=null,toastTimeout=null;
    const app=document.getElementById('app');

    function loadData(){try{const raw=localStorage.getItem(KEY);if(!raw)return {entries:{},custom:{}};const d=JSON.parse(raw);return {entries:(d.entries&&typeof d.entries==='object'&&!Array.isArray(d.entries))?d.entries:{},custom:(d.custom&&typeof d.custom==='object')?d.custom:{}}}catch(e){return {entries:{},custom:{}}}}
    function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){showToast('Não foi possível salvar. Libere espaço no navegador.')}}
    function toISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function fromISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
    function dateOffset(s,n){const d=fromISO(s);d.setDate(d.getDate()+n);return toISO(d)}
    function weekday(s){return fromISO(s).getDay()}
    function formatDate(s,long=false){return new Intl.DateTimeFormat('pt-BR',long?{weekday:'long',day:'numeric',month:'long',year:'numeric'}:{day:'2-digit',month:'short',year:'numeric'}).format(fromISO(s))}
    function html(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function attr(v){return html(v)}
    function idSafe(s){return /^[a-z0-9_-]{1,100}$/i.test(String(s||''))}
    function makeSet(){return {kg:'',reps:'',done:false}}
    function getEntry(s,create=false){if(!data.entries[s]&&create){data.entries[s]={exercises:{},cardio:{done:false,minutes:'',distance:''},notes:''}}return data.entries[s]||null}
    function planExercises(day){let ex=(PLANS[day]?.ex||[]).map(a=>({id:a[0],name:a[1],sets:a[2],target:a[3],kind:a[4]||'reps',custom:false}));const extra=Array.isArray(data.custom[day])?data.custom[day]:[];for(const x of extra){if(x&&idSafe(x.id)&&typeof x.name==='string')ex.push({...x,custom:true})}return ex}
    function exState(s,ex,create=false){const e=getEntry(s,create);if(!e)return null;if(!e.exercises||typeof e.exercises!=='object')e.exercises={};if(!e.exercises[ex.id]&&create)e.exercises[ex.id]={done:false,sets:Array.from({length:ex.sets},makeSet),notes:''};return e.exercises[ex.id]||null}
    function setsFor(s,ex){const val=exState(s,ex);return val&&Array.isArray(val.sets)?val.sets:Array.from({length:ex.sets},makeSet)}
    function progress(s){const day=weekday(s),p=PLANS[day];if(!p)return {done:0,total:0,pct:0};const ex=planExercises(day);const e=getEntry(s);const done=ex.filter(x=>!!e?.exercises?.[x.id]?.done).length+((p.cardio&&e?.cardio?.done)?1:0);const total=ex.length+(p.cardio?1:0);return {done,total,pct:Math.round(100*done/Math.max(total,1))}}
    function activeEntry(s,e){if(!e||typeof e!=='object')return false;if(String(e.notes||'').trim())return true;if(e.cardio&&(e.cardio.done||e.cardio.minutes||e.cardio.distance))return true;return Object.values(e.exercises||{}).some(x=>x&&(x.done||x.notes||x.sets?.some(set=>set&&(set.done||set.kg!==''&&set.kg!=null||set.reps!==''&&set.reps!=null))))}
    function activityDates(){return Object.keys(data.entries).filter(s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&activeEntry(s,data.entries[s])).sort().reverse()}
    function latestEx(s,id){return Object.keys(data.entries).filter(k=>k<s).sort().reverse().map(k=>({date:k,state:data.entries[k]?.exercises?.[id]})).find(x=>x.state&&Array.isArray(x.state.sets)&&x.state.sets.some(set=>set.kg!==''&&set.kg!=null||set.reps!==''&&set.reps!=null))||null}
    function volume(s){const e=getEntry(s);let total=0;for(const x of Object.values(e?.exercises||{})){for(const set of x?.sets||[]){const w=Number(set.kg),r=Number(set.reps);if(Number.isFinite(w)&&w>0&&Number.isFinite(r)&&r>0)total+=w*r}}return total}
    function allVolume(){return activityDates().reduce((acc,s)=>acc+volume(s),0)}
    function fmtN(n){return new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}).format(n)}
    function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.remove('show'),2600)}
    function switchTab(t){tab=t;render();window.scrollTo({top:0,behavior:'smooth'})}
    function renderNav(){const build=(mobile)=>TABS.map(([key,ic,label])=>`<button type="button" data-action="tab" data-tab="${key}" aria-current="${tab===key?'page':'false'}" class="${tab===key?'active':''}">${mobile?`<span class="nav-ico" aria-hidden="true">${ic}</span>`:''}${label}</button>`).join('');document.getElementById('desktopNav').innerHTML=build(false);document.getElementById('mobileNav').innerHTML=build(true)}
    function weekMarkup(){let monday=fromISO(date),offset=(monday.getDay()+6)%7;monday.setDate(monday.getDate()-offset);return `<div class="week-strip" aria-label="Escolha o dia da semana">${Array.from({length:5},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);const s=toISO(d),p=progress(s);return `<button class="week-day ${s===date?'active':''}" data-action="select-date" data-date="${s}" aria-pressed="${s===date}"><span class="weekday">${SHORT_DAYS[d.getDay()].toUpperCase()}</span><span class="daynumber">${d.getDate()}</span>${p.done?'<span class="w-dot"></span>':'<span class="w-blank"></span>'}</button>`}).join('')}</div>`}
    function topControls(){const p=PLANS[weekday(date)];return `<div class="header-line section"><div><p class="eyebrow">TREINO DO DIA</p><h1 class="page-heading">${date===toISO(new Date())?'Hora de evoluir.':'Seu diário de treino.'}</h1><p class="subheading">${p?html(LONG_DAYS[weekday(date)])+' • '+html(formatDate(date)):html(formatDate(date,true))}</p></div><div class="date-tools"><button class="btn iconbtn" data-action="prev-day" aria-label="Dia anterior">‹</button><label class="date-picker" title="Escolher data">📅 &nbsp;${html(formatDate(date))}<input id="dateInput" type="date" value="${date}" aria-label="Escolher data"></label><button class="btn iconbtn" data-action="next-day" aria-label="Próximo dia">›</button><button class="btn btn-ghost" data-action="today">Hoje</button></div></div>`}
    function exMarkup(ex,i){const state=exState(date,ex),sets=setsFor(date,ex),last=latestEx(date,ex.id);const reference=last?last.state.sets.find(x=>x.kg!==''&&x.kg!=null)?.kg:null;const lkg=reference!==null&&reference!==undefined?`Última carga: ${html(reference)} kg • ${html(formatDate(last.date))}`:(last?`Último registro: ${html(formatDate(last.date))}`:'Sem registro anterior');const completed=!!state?.done;
      return `<article class="exercise ${completed?'completed':''}"><div class="ex-top"><div class="index-pill">${String(i+1).padStart(2,'0')}</div><div class="ex-title"><h3>${html(ex.name)}</h3><p>${html(ex.sets)} séries • ${html(ex.kind==='seconds'?ex.target+' de prancha':ex.target+' repetições')}${ex.custom?' • Adicionado':''}</p></div><button class="ex-done" data-action="toggle-ex" data-ex="${attr(ex.id)}" aria-pressed="${completed}"><span class="check-icon" aria-hidden="true">${completed?'✓':''}</span>${completed?'Feito':'Concluir'}</button></div><div class="ex-body"><div class="set-header"><span>Série</span><span>Carga</span><span>${ex.kind==='seconds'?'Tempo':'Reps.'}</span><span style="text-align:right">Feito</span></div>${sets.map((set,j)=>`<div class="set-row"><span class="set-index">${String(j+1).padStart(2,'0')}</span><label class="field"><input aria-label="Carga da série ${j+1} de ${attr(ex.name)} em quilos" type="number" min="0" step="0.5" inputmode="decimal" placeholder="0" data-field="kg" data-ex="${attr(ex.id)}" data-set="${j}" value="${attr(set.kg)}"><span>kg</span></label><label class="field"><input aria-label="${ex.kind==='seconds'?'Segundos':'Repetições'} da série ${j+1} de ${attr(ex.name)}" type="number" min="0" step="1" inputmode="numeric" placeholder="${ex.kind==='seconds'?'40':'12'}" data-field="reps" data-ex="${attr(ex.id)}" data-set="${j}" value="${attr(set.reps)}"><span>${ex.kind==='seconds'?'s':'rep'}</span></label><button class="set-check ${set.done?'checked':''}" data-action="toggle-set" data-ex="${attr(ex.id)}" data-set="${j}" aria-label="${set.done?'Desmarcar':'Marcar'} série ${j+1} de ${attr(ex.name)}" aria-pressed="${!!set.done}">${set.done?'✓':'–'}</button></div>`).join('')}<div class="set-footer"><span class="ref-text">${lkg}</span><div class="mini-actions">${last?`<button class="btn btn-sm" data-action="copy-last" data-ex="${attr(ex.id)}" title="Preencher séries com as últimas cargas">↺ Repetir cargas</button>`:''}<button class="btn btn-sm" data-action="add-set" data-ex="${attr(ex.id)}">+ Série</button>${sets.length>1?`<button class="btn btn-sm" data-action="remove-set" data-ex="${attr(ex.id)}" title="Remover última série">−</button>`:''}${ex.custom?`<button class="btn btn-sm btn-red" data-action="remove-custom" data-ex="${attr(ex.id)}">Excluir</button>`:''}</div></div><textarea class="ex-note" data-field="ex-notes" data-ex="${attr(ex.id)}" rows="1" placeholder="Observação (ex.: aumentar carga na próxima semana)">${html(state?.notes||'')}</textarea></div></article>`}
    function cardioMarkup(){const c=getEntry(date)?.cardio||{},done=!!c.done;return `<section class="card workout-extra"><div class="card-row"><div><h3>🏃 Corrida leve</h3><p class="muted" style="font-size:12px;margin:4px 0 0">Meta de 15–20 minutos após a musculação</p></div><button class="ex-done" data-action="toggle-cardio" aria-pressed="${done}"><span class="check-icon">${done?'✓':''}</span>${done?'Feito':'Concluir'}</button></div><div class="two-col" style="margin-top:16px"><label><span class="form-label">Tempo (min)</span><input class="input" type="number" min="0" step="1" inputmode="numeric" placeholder="Ex.: 20" data-field="cardio-minutes" value="${attr(c.minutes||'')}"></label><label><span class="form-label">Distância (km)</span><input class="input" type="number" min="0" step="0.1" inputmode="decimal" placeholder="Ex.: 2,5" data-field="cardio-distance" value="${attr(c.distance||'')}"></label></div></section>`}
    function timerMarkup(){return `<section class="card timer-card workout-extra"><div><p class="eyebrow" style="margin-bottom:4px">DESCANSO ENTRE SÉRIES</p><div class="timer-time" id="timerReadout">${fmtTime(timerRemaining)}</div></div><div class="timer-controls"><button class="btn btn-sm" data-action="start-timer" data-seconds="60">1 min</button><button class="btn btn-sm" data-action="start-timer" data-seconds="90">1:30</button><button class="btn btn-sm" data-action="start-timer" data-seconds="120">2 min</button><button class="btn btn-sm" data-action="stop-timer">Parar</button></div></section>`}
    function workoutMarkup(){const p=PLANS[weekday(date)];if(!p)return `${topControls()}${weekMarkup()}<div class="empty section"><span class="empty-icon">🌿</span><h2>Dia de descanso</h2><p>Seu plano é de segunda a sexta. Aproveite o fim de semana para recuperar.</p><button class="btn btn-primary" data-action="next-monday">Ir para segunda-feira</button></div>`;const ex=planExercises(weekday(date)),prog=progress(date),seriesDone=ex.reduce((n,x)=>n+setsFor(date,x).filter(z=>z.done).length,0),seriesTotal=ex.reduce((n,x)=>n+setsFor(date,x).length,0);const entry=getEntry(date);
      return `${topControls()}${weekMarkup()}<div class="grid-dashboard"><section class="hero"><div><p class="eyebrow">${html(p.subtitle)}</p><h2>${html(p.title)}</h2><p>${prog.done===prog.total?'Excelente! Você concluiu todos os itens deste treino.':'Marque seus exercícios, registre as séries e acompanhe sua evolução.'}</p></div><div class="ring" style="--pct:${prog.pct}" role="img" aria-label="${prog.pct}% do treino concluído"><div class="ring-in"><strong>${prog.pct}%</strong><small>CONCLUÍDO</small></div></div></section><section class="mini-card"><div class="stat-head"><span>SÉRIES REGISTRADAS</span><span class="stat-icon">↗</span></div><div class="stat-val">${seriesDone}<span class="muted" style="font-size:20px"> / ${seriesTotal}</span></div><div class="stat-foot">${prog.done} de ${prog.total} itens concluídos no dia</div></section></div><div class="section-title"><div><h2>Exercícios do dia</h2><p>Preencha as cargas, repetições e marque o que concluir.</p></div><button class="btn btn-sm" data-action="new-ex">+ Adicionar</button></div><div class="exercises">${ex.map(exMarkup).join('')}</div>${p.cardio?cardioMarkup():''}${timerMarkup()}<section class="card workout-extra"><h3>📝 Anotações do treino</h3><p>Como foi o desempenho, energia, dores ou metas para o próximo?</p><textarea class="input" data-field="daily-notes" placeholder="Ex.: consegui aumentar 2,5 kg no supino; treino rendeu bem...">${html(entry?.notes||'')}</textarea></section><div class="notice"><strong>✓ Salvamento automático.</strong> Tudo o que você marcar ou digitar fica registrado por data neste navegador. Para trocar de celular, use o backup em Ajustes.</div>`}
    function historyMarkup(){const dates=activityDates();return `<div class="section"><p class="eyebrow">HISTÓRICO</p><h1 class="page-heading">Treinos registrados.</h1><p class="subheading">Toque em uma sessão para consultar ou editar as cargas daquele dia.</p></div>${dates.length?`<div class="history-list">${dates.map(s=>{const p=progress(s);return `<button class="history-card" data-action="open-history" data-date="${s}"><h3>${html(LONG_DAYS[weekday(s)])} • ${html(formatDate(s))}</h3><p>${html(PLANS[weekday(s)]?.title||'Sessão personalizada')} • ${p.done}/${p.total} itens</p><div class="bar"><span style="width:${p.pct}%"></span></div><div class="history-percent">${p.pct}% concluído • ${fmtN(volume(s))} kg de volume</div></button>`}).join('')}</div>`:`<div class="empty section"><span class="empty-icon">📋</span><h2>Seu histórico começa hoje</h2><p>Marque exercícios ou registre cargas para criar suas primeiras sessões.</p><button class="btn btn-primary" data-action="tab" data-tab="treino">Abrir treino</button></div>`}`}
    function progressMarkup(){const dates=activityDates(),trained=dates.filter(s=>Object.values(data.entries[s]?.exercises||{}).some(x=>x?.done)).length;const setsDone=dates.reduce((total,s)=>total+Object.values(data.entries[s]?.exercises||{}).reduce((sub,x)=>sub+(x.sets||[]).filter(z=>z.done).length,0),0);const ex=Object.keys(PLANS).flatMap(d=>planExercises(Number(d)));const unique=ex.filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i);if(!unique.some(x=>x.id===chartEx))chartEx=unique[0]?.id||'';const selected=unique.find(x=>x.id===chartEx);const sessions=dates.map(s=>({s,w:Math.max(0,...(data.entries[s]?.exercises?.[chartEx]?.sets||[]).map(v=>Number(v.kg)||0))})).filter(x=>x.w>0).slice(0,7).reverse();const max=Math.max(1,...sessions.map(x=>x.w));return `<div class="section"><p class="eyebrow">SUA EVOLUÇÃO</p><h1 class="page-heading">Um passo por dia.</h1><p class="subheading">Veja a consistência e as cargas que você registrou.</p></div><div class="stats-grid"><div class="stat-box"><div class="stat-val">${trained}</div><label>Dias treinados</label></div><div class="stat-box"><div class="stat-val">${setsDone}</div><label>Séries concluídas</label></div><div class="stat-box"><div class="stat-val">${fmtN(allVolume())}</div><label>Volume total (kg × reps)</label></div></div><section class="card" style="margin-top:20px"><h3>📈 Evolução de carga</h3><p>Maior carga registrada por sessão, em quilos.</p><label class="form-label" for="chartExercise">Escolha o exercício</label><select id="chartExercise" class="input">${unique.map(x=>`<option value="${attr(x.id)}" ${x.id===chartEx?'selected':''}>${html(x.name)} (${html(LONG_DAYS[Object.values(PLANS).findIndex(p=>p.ex.some(a=>a[0]===x.id))+1]||'Extra')})</option>`).join('')}</select>${sessions.length?`<div style="padding:20px 4px 30px"><div class="chart" role="img" aria-label="Evolução da carga de ${attr(selected?.name||'exercício')}">${sessions.map(x=>`<div class="chart-col"><span class="graph-label">${fmtN(x.w)} kg</span><div class="graph-bar" style="height:${Math.max(5,Math.round(100*x.w/max))}%"></div><span class="graph-date">${x.s.slice(8,10)}/${x.s.slice(5,7)}</span></div>`).join('')}</div></div>`:`<div class="empty" style="margin-top:18px;padding:26px 16px"><span class="empty-icon">📊</span><h2>Ainda não há cargas</h2><p>Registre o peso usado nos exercícios para ver sua evolução aqui.</p></div>`}</section><section class="card"><h3>Como acompanhar sua evolução</h3><p>Os números são calculados a partir dos registros que você preencheu.</p><p class="tip">O volume é a soma de carga × repetições de todas as séries registradas. Registros de prancha em segundos não representam volume de musculação; sem carga, não entram no cálculo. Use também a qualidade da execução e o descanso para avaliar o progresso.</p></section>`}
    function settingsMarkup(){return `<div class="section"><p class="eyebrow">SEUS DADOS</p><h1 class="page-heading">Ajustes e backup.</h1><p class="subheading">Seus registros ficam no navegador deste aparelho, sem necessidade de login.</p></div><div class="notice"><strong>Importante:</strong> GitHub Pages publica o site, mas não sincroniza os treinos entre dispositivos. Para mudar de aparelho, exporte seu backup e importe no novo.</div><div class="settings-grid"><section class="card"><h3>⬇ Baixar backup</h3><p>Salve um arquivo JSON com todas as sessões, cargas, notas e exercícios adicionais.</p><button class="btn btn-primary btn-full" data-action="export-json">Baixar backup (.json)</button></section><section class="card"><h3>⬆ Restaurar backup</h3><p>Importe seus dados anteriores. Isso substitui os registros guardados neste navegador.</p><button class="btn btn-full" data-action="import-json">Selecionar arquivo JSON</button></section><section class="card"><h3>▤ Exportar planilha</h3><p>Baixe as séries registradas como CSV para abrir no Excel ou Google Planilhas.</p><button class="btn btn-full" data-action="export-csv">Baixar planilha (.csv)</button></section><section class="card"><h3>🗑 Apagar registros</h3><p>Exclui permanentemente os registros e exercícios adicionais deste navegador.</p><button class="btn btn-red btn-full" data-action="delete-all">Apagar todos os meus dados</button></section></div><section class="card"><h3>📱 Instalar no celular</h3><p>Depois de publicar no GitHub Pages, abra o endereço no seu celular e use a opção “Adicionar à tela inicial” ou “Instalar app” no navegador. Assim, o acesso fica como um aplicativo. O site também pode funcionar offline após o primeiro carregamento.</p></section>`}
    function render(){renderNav();app.innerHTML=tab==='treino'?workoutMarkup():tab==='historico'?historyMarkup():tab==='progresso'?progressMarkup():settingsMarkup();updateTimerDisplay()}
    function findEx(id){return planExercises(weekday(date)).find(x=>x.id===id)}
    function fmtTime(sec){return `${String(Math.floor(Math.max(0,sec)/60)).padStart(2,'0')}:${String(Math.max(0,sec)%60).padStart(2,'0')}`}
    function updateTimerDisplay(){const el=document.getElementById('timerReadout');if(el)el.textContent=fmtTime(timerRemaining)}
    function stopTimer(){clearInterval(timerTick);timerTick=null;timerRemaining=0;updateTimerDisplay()}
    function startTimer(sec){clearInterval(timerTick);const end=Date.now()+sec*1000;timerRemaining=sec;updateTimerDisplay();timerTick=setInterval(()=>{timerRemaining=Math.max(0,Math.ceil((end-Date.now())/1000));updateTimerDisplay();if(timerRemaining===0){clearInterval(timerTick);timerTick=null;showToast('Descanso concluído! Vamos para a próxima série.');try{navigator.vibrate?.([150,100,150])}catch(e){}}},250)}
    function download(name,content,type){const b=new Blob([content],{type});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
    function csvValue(v){let s=String(v??'');if(/^[\s]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
    function exportCSV(){const rows=[['Data','Dia','Exercício','Série','Carga (kg)','Repetições / segundos','Série concluída','Exercício concluído','Observações']];for(const s of activityDates().reverse()){const e=data.entries[s];const day=weekday(s);for(const x of planExercises(day)){const st=e.exercises?.[x.id];if(!st)continue;for(const [i,set] of (st.sets||[]).entries())rows.push([s,LONG_DAYS[day],x.name,i+1,set.kg,set.reps,set.done?'Sim':'Não',st.done?'Sim':'Não',st.notes||''])}if(PLANS[day]?.cardio&&e.cardio?.done)rows.push([s,LONG_DAYS[day],'Corrida leve','', '',e.cardio.minutes+' minutos; '+e.cardio.distance+' km','Sim','Sim',e.notes||''])}download('meu-treino-registros.csv','\ufeff'+rows.map(r=>r.map(csvValue).join(';')).join('\r\n'),'text/csv;charset=utf-8');showToast('Planilha exportada.')}
    function showModal(){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-backdrop" data-action="close-backdrop"><form class="modal" id="newExerciseForm"><h2>Adicionar exercício</h2><p>Ele ficará disponível sempre neste dia da semana.</p><label class="form-label" for="customName">Nome do exercício</label><input id="customName" class="input" type="text" maxlength="65" placeholder="Ex.: crucifixo máquina" required><div class="two-col"><label><span class="form-label">Quantidade de séries</span><select id="customSets" class="input"><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option></select></label><label><span class="form-label">Repetições (meta)</span><input id="customReps" class="input" type="text" maxlength="20" value="10–12" required></label></div><div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button class="btn btn-primary" type="submit">Adicionar</button></div></form></div>`;root.querySelector('#customName').focus()}
    function closeModal(){document.getElementById('modalRoot').innerHTML=''}
    document.addEventListener('click',event=>{const node=event.target.closest('[data-action]');if(!node)return;const action=node.dataset.action,id=node.dataset.ex;const ex=id?findEx(id):null;
      if(action==='tab'){switchTab(node.dataset.tab);return}
      if(action==='select-date'||action==='open-history'){date=node.dataset.date;if(action==='open-history')tab='treino';render();if(action==='open-history')window.scrollTo({top:0,behavior:'smooth'});return}
      if(action==='prev-day'){date=dateOffset(date,-1);render();return}
      if(action==='next-day'){date=dateOffset(date,1);render();return}
      if(action==='today'){date=toISO(new Date());render();return}
      if(action==='next-monday'){let n=(8-weekday(date))%7;if(n===0)n=7;date=dateOffset(date,n);render();return}
      if(action==='toggle-ex'&&ex){const st=exState(date,ex,true);st.done=!st.done;for(const set of st.sets)set.done=st.done;persist();render();if(st.done)showToast('Exercício concluído ✓');return}
      if(action==='toggle-set'&&ex){const st=exState(date,ex,true),idx=Number(node.dataset.set);if(st.sets[idx]){st.sets[idx].done=!st.sets[idx].done;st.done=st.sets.every(x=>x.done);persist();render()}return}
      if(action==='add-set'&&ex){const st=exState(date,ex,true);if(st.sets.length<12){st.sets.push(makeSet());st.done=false;persist();render()}else showToast('Máximo de 12 séries por exercício.');return}
      if(action==='remove-set'&&ex){const st=exState(date,ex,true);if(st.sets.length>1){st.sets.pop();st.done=st.sets.every(x=>x.done);persist();render()}return}
      if(action==='copy-last'&&ex){const last=latestEx(date,ex.id);if(!last)return;const st=exState(date,ex,true);for(let i=0;i<st.sets.length;i++){const prev=last.state.sets[i];if(prev){st.sets[i].kg=prev.kg??'';st.sets[i].reps=prev.reps??''}}persist();render();showToast('Cargas anteriores preenchidas.');return}
      if(action==='toggle-cardio'){const entry=getEntry(date,true);if(!entry.cardio)entry.cardio={done:false,minutes:'',distance:''};entry.cardio.done=!entry.cardio.done;persist();render();return}
      if(action==='start-timer'){startTimer(Number(node.dataset.seconds));return}
      if(action==='stop-timer'){stopTimer();return}
      if(action==='new-ex'){showModal();return}
      if(action==='close-modal'){closeModal();return}
      if(action==='close-backdrop'&&event.target===node){closeModal();return}
      if(action==='remove-custom'&&ex){if(!window.confirm(`Remover “${ex.name}” deste plano? Os registros anteriores ficarão no backup, mas deixarão de aparecer na tela.`))return;data.custom[weekday(date)]=(data.custom[weekday(date)]||[]).filter(x=>x.id!==id);persist();render();showToast('Exercício removido do plano.');return}
      if(action==='export-json'){download(`meu-treino-backup-${toISO(new Date())}.json`,JSON.stringify({app:'meu-treino',version:1,exportedAt:new Date().toISOString(),...data},null,2),'application/json');showToast('Backup baixado com sucesso.');return}
      if(action==='export-csv'){exportCSV();return}
      if(action==='import-json'){document.getElementById('importFile').click();return}
      if(action==='delete-all'){if(window.confirm('Deseja apagar TODOS os registros e exercícios adicionais deste aparelho? Esta ação não pode ser desfeita.')){data={entries:{},custom:{}};persist();render();showToast('Registros apagados.')}return}
    });
    document.addEventListener('input',event=>{const n=event.target,key=n.dataset.field;if(key==='ex-notes'){const ex=findEx(n.dataset.ex);if(ex){exState(date,ex,true).notes=n.value.slice(0,1000);persist()}}if(key==='daily-notes'){getEntry(date,true).notes=n.value.slice(0,3000);persist()}});
    document.addEventListener('change',event=>{const n=event.target,key=n.dataset.field;if(n.id==='dateInput'&&/^\d{4}-\d{2}-\d{2}$/.test(n.value)){date=n.value;render();return}
      if(n.id==='chartExercise'){chartEx=n.value;render();return}
      if((key==='kg'||key==='reps')&&n.dataset.ex){const ex=findEx(n.dataset.ex);if(!ex)return;const st=exState(date,ex,true),set=st.sets[Number(n.dataset.set)];if(!set)return;let v=n.value.trim().replace(',','.');if(v!==''&&(!Number.isFinite(Number(v))||Number(v)<0))v='';set[key]=v===''?'':String(key==='reps'?Math.floor(Number(v)):Math.round(Number(v)*100)/100);n.value=set[key];persist();return}
      if(key==='cardio-minutes'||key==='cardio-distance'){const e=getEntry(date,true);if(!e.cardio)e.cardio={done:false,minutes:'',distance:''};const val=n.value.trim().replace(',','.');e.cardio[key==='cardio-minutes'?'minutes':'distance']=val===''?'':String(Math.max(0,Number(val)||0));persist();return}
    });
    document.addEventListener('submit',event=>{if(event.target.id!=='newExerciseForm')return;event.preventDefault();const name=document.getElementById('customName').value.trim().slice(0,65),sets=Number(document.getElementById('customSets').value),target=document.getElementById('customReps').value.trim().slice(0,20);if(!name||!target)return;const day=weekday(date);if(!data.custom[day])data.custom[day]=[];const id='custom-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);data.custom[day].push({id,name,sets,target,kind:'reps'});persist();closeModal();render();showToast('Exercício adicionado ao plano.');});
    document.getElementById('importFile').addEventListener('change',async(event)=>{const file=event.target.files?.[0];event.target.value='';if(!file)return;try{if(file.size>8*1024*1024)throw new Error('Arquivo muito grande.');const incoming=JSON.parse(await file.text());if(incoming.app!=='meu-treino'||!incoming.entries||!incoming.custom||typeof incoming.entries!=='object'||typeof incoming.custom!=='object'||Array.isArray(incoming.entries))throw new Error('Backup inválido ou de outro aplicativo.');if(!window.confirm('Restaurar este backup? Os dados atuais deste aparelho serão substituídos.'))return;data={entries:incoming.entries,custom:incoming.custom};persist();render();showToast('Backup restaurado com sucesso.')}catch(err){showToast('Não foi possível importar: '+(err.message||'arquivo inválido'))}});
    window.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal()});
    if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
    render();
  })();
  </script>
</body>
</html>
